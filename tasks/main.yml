---
# tasks file for adrianjuhl.shell_capture_stdout_and_stderr

- name: "Set facts"
  ansible.builtin.set_fact:
    adrianjuhl__shell_capture_stdout_and_stderr__capture_stdout_and_stderr_d_directory: "{{ adrianjuhl__shell_capture_stdout_and_stderr__install_bin_directory }}/{{ adrianjuhl__shell_capture_stdout_and_stderr__script_name }}.d"

- name: "Set facts"
  ansible.builtin.set_fact:
    adrianjuhl__shell_capture_stdout_and_stderr__capture_stdout_and_stderr_version_directory: "{{ adrianjuhl__shell_capture_stdout_and_stderr__capture_stdout_and_stderr_d_directory }}/{{ adrianjuhl__shell_capture_stdout_and_stderr__version }}"

- name: "Set facts"
  ansible.builtin.set_fact:
    adrianjuhl__shell_capture_stdout_and_stderr__script_file_path: "{{ adrianjuhl__shell_capture_stdout_and_stderr__capture_stdout_and_stderr_version_directory }}/{{ adrianjuhl__shell_capture_stdout_and_stderr__script_name }}.sh"
    adrianjuhl__shell_capture_stdout_and_stderr__script_source_url: "https://raw.githubusercontent.com/adrianjuhl/adrianjuhl-shell-capture-stdout-and-stderr/refs/{{ adrianjuhl__shell_capture_stdout_and_stderr__ref_type }}/{{ adrianjuhl__shell_capture_stdout_and_stderr__version }}/bin/capture_stdout_and_stderr.sh"
    adrianjuhl__shell_capture_stdout_and_stderr__link_file_path: "{{ adrianjuhl__shell_capture_stdout_and_stderr__install_bin_directory }}/{{ adrianjuhl__shell_capture_stdout_and_stderr__script_name }}.sh"

- name: "Create script install directory"
  ansible.builtin.file:
    dest: "{{ adrianjuhl__shell_capture_stdout_and_stderr__capture_stdout_and_stderr_version_directory }}"
    state: "directory"
    mode: "0755"

- name: "Copy script into place"
  ansible.builtin.get_url:
    url: "{{ adrianjuhl__shell_capture_stdout_and_stderr__script_source_url }}"
    dest: "{{ adrianjuhl__shell_capture_stdout_and_stderr__script_file_path }}"
    mode: "0755"
  ignore_errors: "{{ ansible_check_mode }}"

- name: "Configure 'current' directory link"
  ansible.builtin.file:
    src: "{{ adrianjuhl__shell_capture_stdout_and_stderr__version }}"
    dest: "{{ adrianjuhl__shell_capture_stdout_and_stderr__capture_stdout_and_stderr_d_directory }}/current"
    state: "link"

- name: "Configure a symbolic link to the script"
  ansible.builtin.file:
    src: "{{ adrianjuhl__shell_capture_stdout_and_stderr__capture_stdout_and_stderr_d_directory }}/current/{{ adrianjuhl__shell_capture_stdout_and_stderr__script_name }}.sh"
    dest: "{{ adrianjuhl__shell_capture_stdout_and_stderr__link_file_path }}"
    state: "link"
  when: "adrianjuhl__shell_capture_stdout_and_stderr__create_symbolic_link"
  ignore_errors: "{{ ansible_check_mode }}"

- name: "Create adrianjuhl.shell_capture_stdout_and_stderr.readme file"
  ansible.builtin.copy:
    content: |
      Ansible role adrianjuhl.shell_capture_stdout_and_stderr version: {{ adrianjuhl__shell_capture_stdout_and_stderr__version }}
    dest: "{{ adrianjuhl__shell_capture_stdout_and_stderr__capture_stdout_and_stderr_d_directory }}/adrianjuhl.shell_capture_stdout_and_stderr.readme"
    mode: "0644"
